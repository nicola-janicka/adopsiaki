<form [formGroup]="newDogForm" (ngSubmit)="onSubmit()">
  <label for="addPicture">Link to dog's picture:</label>
  <input
    type="text"
    id="addPicture"
    name="addPicture"
    formControlName="addPicture"
  />
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dogPictures')"
  >
    You need to fill this field.
  </div>
  <button type="button" (click)="addNewPicture()" class="add_circle">
    <span class="material-symbols-outlined"> add_circle </span>
  </button>
  <div class="row">
    <div
      class="column"
      *ngFor="let picture of dogPictures.controls; index as i"
    >
      <img
        src="{{ picture?.value }}"
        alt="dog's picture"
        class="dog_picture_size"
      />
      <button type="button" (click)="deletePicture(i)" class="remove-button">
        <span class="material-symbols-outlined"> delete </span>
      </button>
    </div>
  </div>
  <label for="dname">Dog's name:</label>
  <input type="text" id="dname" name="dname" formControlName="dname" />
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dname')"
  >
    You need to fill this field.
  </div>
  <label for="dbreed">Dog's breed:</label>
  <input type="text" id="dbreed" name="dbreed" formControlName="dbreed" />
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dbreed')"
  >
    You need to fill this field.
  </div>
  <label for="dage">Dog's age:</label>
  <input type="text" id="dage" name="dage" formControlName="dage" />
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dage')"
  >
    You need to fill this field.
  </div>

  <label for="dgender">Dog's gander:</label>
  <select aria-required="true" id="type" formControlName="dgender">
    <option value="male">male</option>
    <option value="female">female</option>
  </select>
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dgender')"
  >
    You need to choose one option.
  </div>
  <br />

  <label for="dweight">Dog's weight in kg:</label>

  <input type="number" id="dweight" name="dweight" formControlName="dweight" />
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('dweight')"
  >
    You need to fill this field.
  </div>
  <label for="ddescription">Dog's description:</label>
  <textarea
    class="ddescription"
    id="ddescription"
    name="ddescription"
    formControlName="ddescription"
  ></textarea>
  <div
    style="color: red; padding-top: 0.2rem"
    [hidden]="invalidFields.get('ddescription')"
  >
    You need to fill this field.
  </div>

  <button type="submit" class="submit">Submit</button>
</form>
