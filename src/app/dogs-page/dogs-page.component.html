<div class="cards-container">
  <mat-card class="dog-card" *ngFor="let dog of dogs">
    <mat-card-header>
      <mat-card-title class="title">{{ dog.name }}</mat-card-title>
      <mat-card-subtitle class="subtitle">{{ dog.breed }}</mat-card-subtitle>
    </mat-card-header>
    <img
      mat-card-image
      [src]="dog.image"
      alt="Photo of {{ dog.name }}"
      class="dog-image"
    />
    <mat-card-content>
      <p class="description">{{ dog.description }}</p>
    </mat-card-content>
    <mat-card-actions class="actions">
      <button mat-button class="info-button">More info</button>
    </mat-card-actions>
  </mat-card>
</div>

<router-outlet></router-outlet>
